<div class="relative my-4" [class.z-50]="open">
  <div class="relative">
    <input type="text" #inputRef [id]="inputId" autocomplete="off" required role="combobox" aria-autocomplete="list"
      [attr.aria-expanded]="open" [attr.aria-controls]="inputId + '-list'"
      [attr.aria-activedescendant]="open && activeIndex >= 0 ? inputId + '-opt-' + activeIndex : null"
      [attr.aria-invalid]="errorMessage ? 'true' : null"
      [attr.aria-describedby]="errorMessage ? inputId + '-error' : null"
      [value]="data" [disabled]="disabled"
      (input)="filter($event)" (focus)="onFocus()" (blur)="onBlur()" (keydown)="onKeydown($event, inputRef)"
      class="peer w-full border-none bg-transparent px-0 py-1.5 pr-6 text-base text-gray-900 outline-none" />

    <label [for]="inputId"
      class="pointer-events-none absolute left-0 top-0 transition-all duration-300 ease-in-out peer-focus:-top-5 peer-focus:text-xs peer-focus:text-primary-500 peer-valid:-top-5 peer-valid:text-xs"
      [class.text-gray-400]="!errorMessage" [class.text-danger]="errorMessage">
      {{ this.label }}
    </label>
    <app-icon name="chevron-down" svgClass="pointer-events-none absolute right-0 top-1/3 size-4 text-gray-500" [strokeWidth]="2" />
    <!-- Gạch chân nền (đỏ khi có lỗi) -->
    <div class="absolute bottom-0 left-0 h-1/24 w-full" [class.bg-gray-300]="!errorMessage" [class.bg-danger]="errorMessage"></div>
    <!-- Gạch chân màu thương hiệu khi focus -->
    <div
      class="absolute bottom-0 left-0 h-1/24 w-full origin-left scale-x-0 bg-primary-500 transition-transform duration-500 ease-in-out peer-focus:scale-x-100">
    </div>

    @if (open) {
    <ul [id]="inputId + '-list'" role="listbox" [attr.aria-label]="label"
      class="absolute left-0 top-full z-50 mt-2 max-h-60 w-full overflow-y-auto rounded-lg border border-gray-200 bg-white py-1 text-sm text-gray-900 shadow-lg">
      @for (item of filtered; track $index; let i = $index) {
      <li [id]="inputId + '-opt-' + i" role="option" [attr.aria-selected]="i === activeIndex"
        class="cursor-pointer px-3 py-2 hover:bg-gray-100" [class.bg-gray-100]="i === activeIndex"
        (mousedown)="choose(item, inputRef); $event.preventDefault()">
        {{ item }}
      </li>
      } @empty {
      <li role="option" aria-disabled="true" class="px-3 py-2 text-gray-500">Không tìm thấy</li>
      }
    </ul>
    }
  </div>
  @if (errorMessage) {
  <p [id]="inputId + '-error'" class="mt-1 text-xs font-medium text-danger">{{ errorMessage }}</p>
  }
</div>
