<div class="relative my-4 group">
  <input
    #inputEl
    type="text"
    [id]="inputId"
    [attr.required]="required"
    [attr.aria-invalid]="errorMessage ? 'true' : null"
    [attr.aria-describedby]="(helperText || errorMessage) ? inputId + '-hint' : null"
    [disabled]="disabled"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onTouch()"
    [placeholder]="' '"
    class="peer w-full border-none border-b-2 text-base border-gray-300 bg-transparent px-0 py-1.5 outline-none transition-all duration-300 ease-in-out focus:border-transparent placeholder-transparent"
  />
  <label
    [for]="inputId"
    class="pointer-events-none absolute left-0 top-0 transition-all duration-300 ease-in-out peer-focus:-top-5 peer-focus:text-xs peer-focus:text-primary-500 peer-valid:-top-5 peer-valid:text-xs"
    [class.text-gray-400]="!errorMessage"
    [class.text-danger]="errorMessage"
  >
    {{ this.label }}
  </label>
  <!-- Underline gray (nền) -->
  <div class="absolute bottom-0 left-0 h-1/24 w-full" [class.bg-gray-300]="!errorMessage" [class.bg-danger]="errorMessage"></div>
  <!-- Underline đỏ thương hiệu (tràn vào khi focus) -->
  <div
    class="absolute bottom-0 left-0 h-1/24 w-full origin-left scale-x-0 bg-primary-500 transition-transform duration-500 ease-in-out peer-focus:scale-x-100"
  ></div>
  @if(helperText || errorMessage){
  <p
    [id]="inputId + '-hint'"
    class="mt-1 text-xs transition-all duration-200"
    [class.text-gray-500]="!errorMessage"
    [class.text-danger]="errorMessage"
    [class.font-medium]="errorMessage">
    {{ errorMessage || helperText }}
  </p>
  }
</div>
