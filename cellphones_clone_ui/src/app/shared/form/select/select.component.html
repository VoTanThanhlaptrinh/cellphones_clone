<div class="flex flex-col gap-1">
  <label [for]="selectId" class="text-sm font-medium text-gray-900">
    {{ label }}@if (required) {<span class="text-danger" aria-hidden="true"> *</span>}
  </label>
  <div class="relative">
    <select [id]="selectId" [disabled]="disabled" [class]="selectClass" [attr.aria-required]="required ? 'true' : null"
      [attr.aria-invalid]="errorMessage ? 'true' : null"
      [attr.aria-describedby]="(helperText || errorMessage) ? selectId + '-hint' : null" (change)="onSelect($event)"
      (blur)="onBlur()">
      <option value="" [selected]="value === null" disabled hidden>{{ placeholder }}</option>
      @for (option of options; track option.value) {
      <option [selected]="isSelected(option)">{{ option.label }}</option>
      }
    </select>
    <span class="pointer-events-none absolute inset-y-0 right-3 grid place-items-center text-gray-500">
      <app-icon name="chevron-down" svgClass="size-4" [strokeWidth]="2" />
    </span>
  </div>
  @if (errorMessage) {
  <p [id]="selectId + '-hint'" class="text-xs font-medium text-danger">{{ errorMessage }}</p>
  } @else if (helperText) {
  <p [id]="selectId + '-hint'" class="text-xs text-gray-500">{{ helperText }}</p>
  }
</div>
