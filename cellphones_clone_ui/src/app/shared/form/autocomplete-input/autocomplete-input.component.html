<div class="relative flex flex-col gap-1">
  <label [for]="inputId" class="text-sm font-medium text-gray-900">
    {{ label }}@if (required) {<span class="text-danger" aria-hidden="true"> *</span>}
  </label>

  <div class="relative">
    <input type="text" #inputRef [id]="inputId" autocomplete="off" role="combobox" aria-autocomplete="list"
      [attr.aria-required]="required ? 'true' : null" [attr.aria-expanded]="open"
      [attr.aria-controls]="inputId + '-list'"
      [attr.aria-activedescendant]="open && activeIndex >= 0 ? inputId + '-opt-' + activeIndex : null"
      [attr.aria-invalid]="errorMessage ? 'true' : null"
      [attr.aria-describedby]="errorMessage ? inputId + '-error' : null" [attr.placeholder]="placeholder"
      [value]="text" [disabled]="disabled" [class]="inputClass" (input)="onInput($event)"
      (focus)="onFocus(inputRef)" (blur)="onBlur()" (keydown)="onKeydown($event)" />

    <div class="absolute inset-y-0 right-1 flex items-center">
      @if (value && !disabled) {
      <button type="button" tabindex="-1" aria-label="Xoá lựa chọn"
        class="grid size-6 place-items-center rounded-full text-gray-500 hover:bg-gray-100"
        (mousedown)="$event.preventDefault()" (click)="clear(inputRef)">
        <app-icon name="x" svgClass="size-4" [strokeWidth]="2" />
      </button>
      }
      <button type="button" tabindex="-1" [attr.aria-label]="open ? 'Đóng danh sách' : 'Mở danh sách'" [disabled]="disabled"
        class="grid size-6 place-items-center rounded-full text-gray-500 hover:bg-gray-100 disabled:opacity-50"
        (mousedown)="$event.preventDefault()" (click)="toggle(inputRef)">
        <app-icon name="chevron-down" svgClass="size-4 transition-transform duration-150" [strokeWidth]="2" />
      </button>
    </div>

    @if (open) {
    <ul [id]="inputId + '-list'" role="listbox" [attr.aria-label]="label"
      class="absolute left-0 top-full z-50 mt-1 max-h-60 w-full overflow-y-auto rounded-xl border border-gray-200 bg-white py-1 text-sm text-gray-900 shadow-lg">
      @for (item of filtered; track $index; let i = $index) {
      <li [id]="inputId + '-opt-' + i" role="option" [attr.aria-selected]="item === value"
        class="cursor-pointer px-3 py-2 hover:bg-gray-100"
        [class.bg-gray-100]="i === activeIndex" [class.font-medium]="item === value"
        [class.text-primary-500]="item === value"
        (mousedown)="choose(item); $event.preventDefault()">
        {{ item }}
      </li>
      } @empty {
      <li role="option" aria-disabled="true" aria-selected="false" class="px-3 py-2 text-gray-500">
        {{ original.length === 0 ? emptyText : 'Không tìm thấy kết quả phù hợp' }}
      </li>
      }
    </ul>
    }
  </div>

  @if (errorMessage) {
  <p [id]="inputId + '-error'" class="text-xs font-medium text-danger">{{ errorMessage }}</p>
  }
</div>
