<div class="flex flex-col gap-1">
  <label [for]="inputId" class="text-sm font-medium text-gray-900">
    {{ label }}@if (required) {<span class="text-danger" aria-hidden="true"> *</span>}
  </label>
  <input
    [id]="inputId"
    [type]="type"
    [attr.autocomplete]="autocomplete"
    [attr.placeholder]="placeholder || null"
    [attr.aria-required]="required ? 'true' : null"
    [attr.aria-invalid]="errorMessage ? 'true' : null"
    [attr.aria-describedby]="(helperText || errorMessage) ? inputId + '-hint' : null"
    [disabled]="disabled"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onTouch()"
    [class]="inputClass"
  />
  @if (errorMessage) {
  <p [id]="inputId + '-hint'" class="text-xs font-medium text-danger">{{ errorMessage }}</p>
  } @else if (helperText) {
  <p [id]="inputId + '-hint'" class="text-xs text-gray-500">{{ helperText }}</p>
  }
</div>
