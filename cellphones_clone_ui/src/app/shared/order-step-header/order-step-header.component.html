<div class="flex items-center justify-between">
  <button type="button" class="btn btn-ghost btn-sm size-8 px-0" [attr.aria-label]="backLabel" (click)="back.emit()">
    <app-icon name="arrow-left" svgClass="size-5" />
  </button>
  <h1 class="text-lg font-bold text-gray-900">{{ title }}</h1>
  <span class="size-8" aria-hidden="true"></span>
</div>

<ol class="mt-3 grid grid-cols-2 gap-2 text-sm font-bold uppercase">
  @if (step === 1) {
  <li class="border-b-2 border-primary-500 pb-2 text-center text-primary-500" aria-current="step">1. Thông tin</li>
  <li class="border-b-2 border-gray-200 pb-2 text-center text-gray-400">2. Thanh toán</li>
  } @else {
  <li class="border-b-2 border-gray-200 pb-2 text-center">
    <button type="button" class="uppercase text-gray-400 hover:text-primary-500" (click)="infoClick.emit()">
      1. Thông tin
    </button>
  </li>
  <li class="border-b-2 border-primary-500 pb-2 text-center text-primary-500" aria-current="step">2. Thanh toán</li>
  }
</ol>
