<h2 mat-dialog-title class="font-bold">{{ isEdit ? 'Sửa' : 'Thêm' }} {{ data.resource.singular }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <mat-dialog-content>
    <div class="space-y-4 pt-1">
      @for (field of fields; track field.key) {
      @if (field.type === 'select') {
      <app-select [formControlName]="field.key" [label]="field.label" [required]="!!field.required"
        [options]="options()[field.key] ?? []" [placeholder]="'Chọn ' + field.label.toLowerCase()"
        [errorMessage]="errorFor(field)" />
      } @else {
      <app-input [formControlName]="field.key" [label]="field.label" [required]="!!field.required"
        [errorMessage]="errorFor(field)" />
      }
      }
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="gap-2 pb-4">
    <button type="button" class="btn btn-ghost" [mat-dialog-close]="false">Huỷ</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">{{ saving() ? 'Đang lưu…' : 'Lưu' }}</button>
  </mat-dialog-actions>
</form>
