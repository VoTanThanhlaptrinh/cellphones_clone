<header class="sticky top-0 z-30 flex h-16 items-center gap-2 border-b border-gray-200 bg-white px-3 md:px-6">
  <button type="button" class="btn btn-ghost btn-sm size-10 px-0" aria-label="Mở hoặc đóng menu"
    [attr.aria-expanded]="sidebar.mobileOpen()" (click)="sidebar.toggle()">
    <app-icon name="menu" svgClass="size-5" />
  </button>

  <div class="ml-auto flex items-center gap-1 md:gap-3">
    <a routerLink="/home" class="btn btn-ghost btn-sm">Về cửa hàng</a>
    @if (user(); as u) {
    <div class="flex items-center gap-2">
      <span class="grid size-8 place-items-center rounded-full bg-primary-100 text-sm font-bold text-primary-500"
        aria-hidden="true">{{ initial() }}</span>
      <span class="hidden max-w-40 truncate text-sm font-medium text-gray-900 md:inline">{{ u.fullName }}</span>
    </div>
    }
    <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">
      <app-icon name="logout" svgClass="size-4" />
      <span class="hidden sm:inline">Đăng xuất</span>
    </button>
  </div>
</header>
