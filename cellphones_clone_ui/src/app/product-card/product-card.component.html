@if (productView; as p) {
<a
  [routerLink]="['/product', p.id]"
  class="group relative flex h-full w-full flex-col gap-2 rounded-xl bg-white p-3 shadow-card transition-shadow hover:shadow-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-300"
>
  @if (discountPercent > 0) {
  <span class="absolute left-0 top-2 z-10 rounded-r-lg bg-primary-500 px-2 py-0.5 text-xs font-bold text-white">
    Giảm {{ discountPercent }}%
  </span>
  }
  <img
    [src]="p.imgUrl"
    [alt]="p.productName"
    width="160"
    height="160"
    loading="lazy"
    class="mx-auto mt-4 aspect-square w-full max-w-40 object-contain transition-transform duration-200 group-hover:scale-[1.02]"
  />
  <h3 class="min-h-10 text-sm font-medium text-gray-900 line-clamp-2">{{ p.productName }}</h3>
  <div class="mt-auto flex flex-wrap items-baseline gap-x-2">
    <span class="text-base font-bold text-primary-500">{{ p.salePrice | vnd }}</span>
    @if (discountPercent > 0) {
    <span class="text-xs text-gray-500 line-through">{{ p.basePrice | vnd }}</span>
    }
  </div>
</a>
}
