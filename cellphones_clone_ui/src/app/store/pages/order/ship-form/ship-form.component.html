<!-- Bước 1 (trang địa chỉ): giao hàng tận nơi -->
<div class="mx-auto w-full max-w-160 px-3 pb-36 pt-3">
  <app-order-step-header title="Giao hàng tận nơi" backLabel="Quay lại thông tin khách hàng" [step]="1"
    (back)="goBack()" />

  <h2 class="mt-5 text-sm font-bold uppercase text-gray-900">Thông tin người nhận</h2>
  <form [formGroup]="group" class="mt-2 space-y-4 rounded-xl bg-white p-4 shadow-card">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-input formControlName="receiverName" label="Tên người nhận" autocomplete="name" [required]="true"
        [errorMessage]="errorFor('receiverName')" />
      <app-input formControlName="receiverPhone" type="tel" autocomplete="tel" label="Số điện thoại" [required]="true"
        [errorMessage]="errorFor('receiverPhone')" />
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <app-autocomplete-input label="Tỉnh/Thành phố" placeholder="Chọn tỉnh/thành phố" [required]="true"
        [original]="cities()" formControlName="shipCity" (dataChosen)="onCityChosen($event)"
        emptyText="Đang tải danh sách…" [errorMessage]="errorFor('shipCity')" />
      <app-autocomplete-input label="Quận/Huyện" placeholder="Chọn quận/huyện" [required]="true"
        [original]="districts()" formControlName="shipDistrict" (dataChosen)="onDistrictChosen($event)"
        emptyText="Vui lòng chọn tỉnh/thành phố trước" [errorMessage]="errorFor('shipDistrict')" />
      <app-autocomplete-input label="Phường/Xã" placeholder="Chọn phường/xã" [original]="wards()"
        formControlName="shipWard" emptyText="Vui lòng chọn quận/huyện trước" />
    </div>

    <app-input formControlName="address" label="Số nhà, tên đường" autocomplete="street-address" [required]="true"
      [errorMessage]="errorFor('address')" />
    <app-input formControlName="note" label="Ghi chú khác (nếu có)" />
  </form>

  <app-order-bottom-bar [total]="total" [disabled]="isLoading()" (action)="goNext()">
    {{ isLoading() ? 'Đang xử lý…' : 'Tiếp tục' }}
  </app-order-bottom-bar>
</div>
