<h2 mat-dialog-title class="text-lg font-bold text-gray-900">Danh mục sản phẩm</h2>
<mat-dialog-content>
  @if (categories().length === 0) {
  <p class="py-6 text-center text-sm text-gray-600" role="status">Đang tải danh mục…</p>
  } @else {
  <ul class="grid gap-1 sm:grid-cols-2">
    @for (category of categories(); track category.id) {
    @if (category.slugName) {
    <li>
      <a [routerLink]="['/category', category.slugName]" (click)="close()"
        class="flex items-center justify-between gap-2 rounded-lg px-3 py-3 text-sm font-medium text-gray-900 hover:bg-gray-100 hover:text-primary-500 focus-visible:bg-gray-100 focus-visible:outline-none">
        <span>{{ category.name }}</span>
        <app-icon name="chevron-right" svgClass="size-4 shrink-0 text-gray-400" [strokeWidth]="2" />
      </a>
    </li>
    }
    }
  </ul>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" mat-dialog-close class="btn btn-ghost">Đóng</button>
</mat-dialog-actions>
