<h2 mat-dialog-title class="text-center font-bold">Đăng nhập để tiếp tục</h2>

<mat-dialog-content>
    <div class="flex flex-col items-center px-4 py-2">
        <p class="mt-2 text-center text-2xl font-bold text-primary-500">Smember</p>
        <img src="assets/images/modal_login.png" alt="" aria-hidden="true" width="48" height="80"
            class="mt-2 h-20 w-12 object-contain">
        <p class="mt-4 text-center text-base font-medium text-gray-900">
            Vui lòng đăng nhập tài khoản Smember để xem ưu đãi và thanh toán dễ dàng hơn.
        </p>
    </div>
</mat-dialog-content>

<mat-dialog-actions class="pb-4">
    <div class="mt-2 grid w-full grid-cols-2 gap-3 px-4">
        <a routerLink="/register" mat-dialog-close class="btn btn-outline btn-lg">Đăng ký</a>
        <a routerLink="/login" mat-dialog-close class="btn btn-primary btn-lg">Đăng nhập</a>
    </div>
</mat-dialog-actions>
